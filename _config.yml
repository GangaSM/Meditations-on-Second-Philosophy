# ---------------------------------------------------------------- identity --

title:    Ganga Singh Manchanda
tagline:  doctoral researcher in quantum algorithms
author:   Ganga Singh Manchanda
email:    ganga@manchanda.co.uk
description: >-
  Ganga Singh Manchanda is a doctoral researcher in quantum algorithms at the
  University of Oxford and IBM Quantum, and the author of Meditations on Second
  Philosophy.

# Currently served from the GitHub Pages project path. To move to the custom
# domain: rename CNAME.disabled back to CNAME and swap these two lines for the
# commented pair below. Do the DNS work first — see the README.
url:     "https://gangasm.github.io"
baseurl: "/Meditations-on-Second-Philosophy"
# url:     "https://manchanda.co.uk"
# baseurl: ""

# Shown as plain text on the about page, obfuscated against scrapers.
contact:
  - label: research
    address: ganga[dot]manchanda[at]chem[dot]ox[dot]ac[dot]uk
    mailto: ganga.manchanda@chem.ox.ac.uk
  - label: personal
    address: ganga[at]manchanda[dot]co[dot]uk
    mailto: ganga@manchanda.co.uk

# The one line of links on the about page. Add or reorder freely.
links:
  - title: cv
    url: /assets/CV.pdf
  - title: linkedin
    url: https://www.linkedin.com/in/gangamanchanda/
  - title: github
    url: https://github.com/GangaSM
  - title: orcid
    url: https://orcid.org/0009-0009-8891-4766
  - title: arxiv
    url: https://arxiv.org/a/manchanda_g_1

icon: /assets/images/icon-512.png   # the MoSP M, cropped from the wordmark

# 4:5 crop, around 1100px tall.
portrait: /assets/images/portrait.jpg

# The blog keeps its own identity inside the site.
mosp:
  title: Meditations on Second Philosophy
  # One line, sits in the plum panel under the wordmark.
  blurb: Sharing ideas in physics and philosophy.
  # A longer introduction, sits above the list of articles.
  summary: >-
    The exploratory corner of the site, though in practice mostly an archive — of
    work, of thoughts I want to keep hold of, and of ideas within physics and
    philosophy I would otherwise lose. I lack the patience to do mathematics as a
    mathematician and lack the experience to do philosophy as a philosopher, but
    that isn't necessarily a bad thing. Named after Descartes' Meditations on First
    Philosophy; the colour scheme is inspired by the Leviathan, which was a raid in
    Destiny 2.

# ------------------------------------------------------------------ build --

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

permalink: /mosp/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_id: mosp

plugins:
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
  - CODE_OF_CONDUCT.md
  - Favicon.key
  - .idea/
