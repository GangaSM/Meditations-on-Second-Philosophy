---
layout: default
---

<article class="wrap{% if page.wide %} wrap--wide{% endif %}">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="page-head__sub">{{ page.subtitle }}</p>
    {%- endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
