portrait: /assets/images/portrait.jpg

# The blog keeps its own identity inside the site.
mosp:
  title: Meditations on Second Philosophy
  # One line, sits in the plum panel under the wordmark.
  blurb: Sharing ideas in physics, philosophy, and theology.
  # A longer introduction, sits above the list of articles.
  summary: >-
    This blog is an exploratory exercise, though in practice mostly an archive,
    of interesting thoughts and ideas. By training, I am a theoretical physicist,
    and I carry that style of thinking into all aspects of inquiry. I lack the
    patience to do mathematics as a mathematician and the experience to do philosophy
    as a philosopher, but that isn’t necessarily a bad thing. This blog is named
    after Descartes’ *Meditations on First Philosophy*, and its colour scheme is
    inspired by the Leviathan raid in *Destiny 2*.

# ------------------------------------------------------------------ build --

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

permalink: /mosp/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav_id: mosp

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
  - .idea/
